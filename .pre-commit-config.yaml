repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: end-of-file-fixer
        exclude: ^\.idea/
      - id: trailing-whitespace
        exclude: ^\.idea/
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=no"]

  - repo: local
    hooks:
      - id: just-fmt
        name: just --fmt
        entry: sh -c 'for file do just --fmt --justfile "$file" || exit; done' --
        language: system
        files: '(?i)(^|/)\.?justfile$|\.just$'
        types: [file]
      - id: oxfmt
        name: vp fmt
        # Formats json, json5, jsonc, yaml, markdown, html, css, and graphql via oxfmt.
        # The Klass HTML generator emits oxfmt-canonical markup (e.g. double-quoted CSS
        # in its inline <style>), so the generated golden fixtures are already formatted
        # and oxfmt is a no-op on them. Nothing is excluded.
        entry: vp fmt --no-error-on-unmatched-pattern
        language: system
      - id: prettier-java
        name: prettier-java-next-line
        # Prettier resolves plugins from the working directory, so load the mise-installed plugin by path.
        entry: sh -c 'prettier --plugin "$(mise where npm:prettier-java-next-line)/node_modules/prettier-java-next-line/dist/index.mjs" --write "$@"' --
        language: system
        types: [java]
        # Generator golden files under src/test/resources are compared byte-for-byte by tests,
        # the Maven wrapper downloader is vendored, and IntelliJ file templates are not valid Java.
        exclude: '/src/test/resources/|/\.mvn/wrapper/|(^|/)\.idea/'
      - id: markdownlint-cli2
        name: markdownlint-cli2
        entry: markdownlint-cli2 --no-globs
        language: system
        types: [markdown]

  - repo: https://github.com/motlin/klassfmt
    rev: v0.1.0
    hooks:
      - id: klassfmt-markdown
